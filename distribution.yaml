name: shkola
version: 1.0.2
description: Учебный ассистент «Нейрон» для учеников 10–13 лет (кружок 
  «Нейросети и ИИ», ИТ-куб). Уточняющие вопросы, проверка фактов, никаких 
  опасных действий, эскалация к взрослому.
author: Максим — педагог ИИ, МБОУ СОШ №48 (Шахты)
license: MIT
env_requires:
  - name: OPENROUTER_API_KEY
    description: "Ключ OpenRouter для доступа к модели (вписать в profiles/shkola/.env)"
    required: true
source: github.com/makss33323/hermes-shkola
